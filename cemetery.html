<style>

    --neon-red: #ff1e43;
    --neon-red-bright: #ff0033;

    min-height: 100vh;

  .scanlines::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 2px, transparent 3px);
    z-index: 50;
  }

  .neon-text{

  .back-link{
    display: inline-flex;

  .back-link:hover{ color: #b8b8c0; }

  .info-panel{
    border: 2px solid #2a2a2e;
    background: linear-gradient(180deg, rgba(30,30,34,0.35), rgba(10,10,12,0.35));

  .panel-eyebrow{

  .body-copy{

    line-height: 1.65;

    border: 2px solid #2a2a2e;
    background: #0a0a0c;
    padding: 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .grave-icon{
    font-size: 34px;
    line-height: 1;
    filter: grayscale(0.6) brightness(0.75);
    flex-shrink: 0;
  }
  .grave-name{
    font-size: 13px;
    color: #cfcfd6;
  }
  .grave-detail{
    font-family: 'VT323', monospace;

<body class="scanlines flex items-center justify-center px-4 py-10">

<main class="w-full max-w-xl">

  <header class="flex flex-col items-center mb-6">
    <a href="index.html" class="back-link mb-4">&larr; BACK TO FAUCET</a>
    <div class="text-5xl mb-5" style="filter: drop-shadow(0 0 6px #444) drop-shadow(0 0 16px #333); opacity:0.85;" aria-hidden="true">🪦</div>
    <h1 class="neon-text text-2xl sm:text-3xl tracking-widest text-center">CEMETERY</h1>
    <p class="text-[9px] text-[#6e6e76] mt-3 tracking-widest text-center">IN MEMORY OF THOSE LOST TO CAT HACK</p>
  </header>

  <section class="info-panel p-6 sm:p-8" aria-labelledby="graves-heading">
    <p class="panel-eyebrow mb-4">RESTING PLACE</p>
    <h2 id="graves-heading" class="sr-only">Fallen Pets</h2>
    <div class="flex flex-col gap-4" id="gravesList"></div>
  </section>

  <footer class="mt-8 text-center text-[8px] text-[#4a4a50] leading-relaxed">
    <p>MEOWFRIEND IS AN INDEPENDENT FAN PROJECT AND DEMO FAUCET.</p>
    <p class="mt-2">NOT AFFILIATED WITH THE OFFICIAL MEOWCOIN TEAM. NOT FINANCIAL ADVICE.</p>
    <p class="mt-2">&copy; 2026 MEOWFRIEND</p>
  </footer>

</main>

<script>
  const gravesList = document.getElementById("gravesList");

  function formatDate(ts){
    const d = new Date(ts);
    return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
  }

  function formatLifespan(birthMs, deathMs){
    const totalDays = Math.max(0, Math.floor((deathMs - birthMs) / (1000 * 60 * 60 * 24)));
    if(totalDays < 1) return "less than a day";
    if(totalDays === 1) return "1 day";
    return `${totalDays} days`;
  }

  function renderCemetery(){
    const graves = getCemetery().slice().reverse(); // most recent first
    if(graves.length === 0){
      gravesList.innerHTML = `<p class="body-copy text-base">No graves yet. Every pet currently out there is still alive.</p>`;
      return;
    }
    gravesList.innerHTML = graves.map(g => `
      <div class="grave">
        <span class="grave-icon" aria-hidden="true">${g.species || "🐱"}</span>
        <div>
          <div class="grave-name">${(g.name || "UNKNOWN").toUpperCase()}</div>
          <div class="grave-detail">
            Weight at death: ${(g.finalWeight || 0).toFixed(1)} lb &nbsp;•&nbsp; IQ at death: ${Math.round(g.finalIq || 0)}<br>
            Born ${formatDate(g.birthDate)} &mdash; Died ${formatDate(g.deathDate)}<br>
            Lived ${formatLifespan(g.birthDate, g.deathDate)}
          </div>
          <div class="grave-cause">${g.cause || "Cause unknown"}</div>
        </div>
      </div>
    `).join("");
  }

  renderCemetery();
  document.addEventListener("gotchya:pet-died", renderCemetery);
</script>

</body>
